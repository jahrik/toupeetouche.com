version: '3.5'

services:

  toupee_touche:
    image: jahrik/toupee_touche:aarch64
    networks:
      - traefik
    deploy:
      replicas: 1
      labels:
        traefik.enable: 1
        traefik.http.services.toupee_touche.loadbalancer.server.port: 3000
        traefik.backend: toupee_touche
        traefik.docker.network: traefik
        traefik.frontend.rule: Host:toupeetouche.com
      placement:
        constraints:
          - node.labels.arch == aarch64

networks:
  traefik:
    name: traefik
    driver: overlay
    external: true
